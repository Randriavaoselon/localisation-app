name: Fabriquer l'installateur Windows

# Lancement manuel : onglet « Actions » > « Fabriquer l'installateur Windows » > « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse de votre serveur (ex. https://mon-serveur.onrender.com)"
        required: true
        type: string
      publish_to_repo:
        description: "Ajouter l'installateur au dépôt (dossier installers/) pour que le serveur le propose"
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # nécessaire pour ajouter installers/SuricateTracker-Setup.exe au dépôt

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # inclut tkinter, nécessaire à la fenêtre de configuration

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fabriquer SuricateTracker.exe puis SuricateTracker-Setup.exe
        shell: cmd
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: call build_installer.bat "%SERVER_URL%" nopause

      - name: Garder l'installateur (téléchargeable dans le résumé de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: SuricateTracker-Setup
          path: installers/SuricateTracker-Setup.exe
          if-no-files-found: error

      - name: Ajouter l'installateur au dépôt (le serveur le propose aux utilisateurs connectés)
        if: ${{ inputs.publish_to_repo }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f installers/SuricateTracker-Setup.exe
          if git diff --cached --quiet; then
            echo "Installateur identique : rien à publier."
          else
            git commit -m "Installateur Windows (fabriqué par GitHub Actions)"
            git push
          fi
