name: Fabriquer l'application Android (APK)

# Lancement manuel : onglet « Actions » > « Fabriquer l'application Android (APK) » > « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse de votre serveur (ex. https://selonmoc.pythonanywhere.com)"
        required: true
        type: string
      publish_to_repo:
        description: "Ajouter l'APK au dépôt (dossier installers/) pour que le serveur le propose"
        required: true
        type: boolean
        default: true

permissions:
  contents: write   # nécessaire pour ajouter la clé de signature et installers/SuricateTracker.apk au dépôt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Une seule clé de signature, créée à la première fabrication puis conservée dans le dépôt :
      # sans elle, chaque nouvelle fabrication aurait une signature différente et Android refuserait
      # de mettre l'application à jour (il faudrait la désinstaller). Gardez ce dépôt PRIVÉ.
      - name: Créer la clé de signature (première fois seulement)
        shell: bash
        run: |
          if [ ! -f android/suricate.keystore ]; then
            keytool -genkeypair -keystore android/suricate.keystore -storetype PKCS12 \
              -storepass suricate-tracker -keypass suricate-tracker -alias suricate \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Suricate Tracker, O=Suricate, C=MG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android/suricate.keystore
            git commit -m "Clé de signature de l'application Android (créée par GitHub Actions)"
            git push
          fi

      - name: Compiler l'APK
        working-directory: android
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: gradle --no-daemon assembleRelease -PserverUrl="$SERVER_URL" -PversionCode=${{ github.run_number }}

      - name: Préparer SuricateTracker.apk
        shell: bash
        run: |
          mkdir -p installers
          cp android/app/build/outputs/apk/release/app-release.apk installers/SuricateTracker.apk
          ls -l installers/SuricateTracker.apk

      - name: Garder l'APK (téléchargeable dans le résumé de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: SuricateTracker-APK
          path: installers/SuricateTracker.apk
          if-no-files-found: error

      - name: Ajouter l'APK au dépôt (le serveur le propose pour le téléchargement)
        if: ${{ inputs.publish_to_repo }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f installers/SuricateTracker.apk
          if git diff --cached --quiet; then
            echo "APK identique : rien à publier."
          else
            git commit -m "Application Android (fabriquée par GitHub Actions)"
            git push
          fi
