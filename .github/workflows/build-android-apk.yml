name: Fabriquer l'application Android (APK)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Adresse de votre serveur (ex. https://selonmoc.pythonanywhere.com)"
        required: true
        type: string
      publish_to_repo:
        description: "Ajouter l'APK au dépôt (dossier installers/) pour que le serveur le propose"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Diagnostic : vérifie quels dépôts sont joignables depuis le runner
      - name: Tester l'accès aux dépôts Maven
        shell: bash
        run: |
          for u in \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.22/kotlin-stdlib-1.9.22.pom \
            https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.22/kotlin-stdlib-1.9.22.pom \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-gradle-plugin/1.9.24/kotlin-gradle-plugin-1.9.24.pom ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u" || true)
            echo "$code  $u"
          done

      - name: Créer la clé de signature (première fois seulement)
        shell: bash
        run: |
          if [ ! -f android/suricate.keystore ]; then
            keytool -genkeypair -keystore android/suricate.keystore -storetype PKCS12 \
              -storepass suricate-tracker -keypass suricate-tracker -alias suricate \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Suricate Tracker, O=Suricate, C=MG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android/suricate.keystore
            git commit -m "Clé de signature de l'application Android (créée par GitHub Actions)"
            git push
          fi

      - name: Compiler l'APK (3 essais en cas d'erreur réseau)
        working-directory: android
        env:
          SERVER_URL: ${{ inputs.server_url }}
        shell: bash
        run: |
          for i in 1 2 3; do
            if gradle --no-daemon assembleRelease \
                 -PserverUrl="$SERVER_URL" \
                 -PversionCode=${{ github.run_number }}; then
              exit 0
            fi
            echo "Essai $i échoué, nouvelle tentative dans 20 s..."
            sleep 20
          done
          exit 1

      - name: Préparer SuricateTracker.apk
        shell: bash
        run: |
          mkdir -p installers
          cp android/app/build/outputs/apk/release/app-release.apk installers/SuricateTracker.apk
          ls -l installers/SuricateTracker.apk

      - name: Garder l'APK (téléchargeable dans le résumé de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: SuricateTracker-APK
          path: installers/SuricateTracker.apk
          if-no-files-found: error

      - name: Ajouter l'APK au dépôt
        if: ${{ inputs.publish_to_repo }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f installers/SuricateTracker.apk
          if git diff --cached --quiet; then
            echo "APK identique : rien à publier."
          else
            git commit -m "Application Android (fabriquée par GitHub Actions)"
            git pull --rebase
            git push
          fi
